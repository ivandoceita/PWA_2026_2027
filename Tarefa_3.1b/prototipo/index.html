<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Protótipo da Página de Administração do Animalec com as entidades Sponsors e Experts">
  <meta name="author" content="Ivando Viegas de Ceita (2401837)">
  <title>Back-office · Animalec</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- Aplicação VueJS 3 (SPA). A estrutura da página usa os elementos semânticos do HTML5:
     header (cabeçalho), nav (menu), main (conteúdo), footer (rodapé). -->
<div id="app">

  <!-- Página pública: login -->
  <router-view v-if="publica"></router-view>

  <!-- Páginas protegidas: estrutura do back-office -->
  <div v-else class="estrutura" :class="{ 'menu-aberto': menuAberto }">
    <a href="#conteudo" class="saltar">Saltar para o conteúdo</a>

    <header class="cabecalho">
      <button type="button" class="botao-menu" :aria-expanded="menuAberto" aria-controls="menu-principal"
              @click="menuAberto = !menuAberto">
        <span class="sr-only">Abrir menu</span><span class="hamburguer" aria-hidden="true"></span>
      </button>
      <router-link to="/painel" class="marca">
        <span class="logo" aria-hidden="true">A</span>
        <span><strong>Animalec</strong><small>Página de Administração</small></span>
      </router-link>
      <div class="sessao">
        <span class="email-sessao">{{ utilizador }}</span>
        <button type="button" class="btn btn-sec btn-peq" @click="sair">Sair</button>
      </div>
    </header>

    <nav id="menu-principal" class="menu" aria-label="Menu principal">
      <p class="menu-titulo">Menu</p>
      <ul>
        <li v-for="item in menu" :key="item.para">
          <router-link :to="item.para" :class="{ ativo: ativo(item) }" :aria-current="ativo(item) ? 'page' : null">
            {{ item.nome }}<span v-if="item.novo" class="ponto" :class="item.novo" aria-hidden="true"></span>
          </router-link>
        </li>
      </ul>
      <p class="versao">v1.0 · 2026</p>
    </nav>
    <div class="fundo-menu" @click="menuAberto = false" aria-hidden="true"></div>

    <main id="conteudo" class="conteudo" tabindex="-1">
      <router-view :key="$route.fullPath"></router-view>
    </main>

    <footer class="rodape">
      <p>&copy; 2026 Animalec · Back-office — Ivando Viegas de Ceita (2401837) ·
        <a href="mailto:2401837@estudante.uab.pt">2401837@estudante.uab.pt</a></p>
    </footer>

    <p v-if="aviso.texto" class="toast" :class="aviso.tipo" role="status" aria-live="polite">{{ aviso.texto }}</p>
  </div>
</div>

<!-- VueJS 3 e Vue Router 4 (cópia local, funciona sem internet) -->
<script src="js/vendor/vue.global.prod.js"></script>
<script src="js/vendor/vue-router.global.prod.js"></script>
<!-- Dados, componentes e páginas -->
<script src="js/dados.js"></script>
<script src="js/componentes.js"></script>
<script src="js/paginas/entidades.js"></script>
<script src="js/paginas/sponsors.js"></script>
<script src="js/paginas/experts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
